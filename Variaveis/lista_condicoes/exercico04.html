<!DOCTYPE html>

<body>

                <img src="imagem/exerc.jpg" alt="Triângulo" class="img-fluid">
            </div>
            <div class="col-8">
                <h1>Programa Lados de um Triângulo</h1>
                <form action="">
                    <p>
                        Lado A:
                        <input type="number" id="inA" min="0" step="0.1" required>

                        Lado B:

                <p>&nbsp;</p>

                <pre id="outResp2"></pre>
