<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Velocidade</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
     <div class="container">
      <div class="row">
        <div class="col-4">
            <img src="imagem/exerc.jpg" alt="">
        </div>
        <div class="col-8">
          <h1>Programa Verifica velocidade</h1>
          <form action="">
            <p>
              Velocidade Permetida:
              <input type="number" id="inPermitida" min="0" step="0.10">
            </p>
            <p> 
              Velocidade do Condutor:
                <input type="number" id="inCondutor" min="0" required>
            </p>
            <input type="submit" value="Verificar do Condutor" class="btn btn-warning">
          </form>
          <p>&nbsp;</p>
          <h3></h3>
        </div>
      </div>
    </div>
    <script src="js/ex02.js"></script>
</body>
</html>
