<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan House JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Lan House JS</h1>
                <form action="">
                    <p>Valor por 15 min de uso
                        <input type="Number" id="inValor" min="0" step="0.01">
                    </p>
                    <p>Tempo de uso do cliente:
                        <input type="Number" id="inTempo" min="0" step="1">
                    </p>
                    <input type="submit" id="Calcular Valor a pagar" class="btn btn-warning">
                </form>
                <h3></h3>
            </div>
        </div>
    </div>
    <script src="js/ex02lanhouse.js"></script>
</body>
</html>
